name: Forestall watcher

# Optional extra pinger: every 15 minutes, ask Forestall to check watched orders
# that are due. No secret needed: the endpoint is throttled server-side.
# Forestall also sweeps daily via Vercel Cron and whenever the app is opened.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sweep due orders
        run: curl -fsS -X POST https://forestall-gamma.vercel.app/api/watch/tick --max-time 240
